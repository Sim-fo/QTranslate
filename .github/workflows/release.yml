name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build app
        run: ./gradlew :app:shadowJar

      - name: Build plugins
        run: |
          ./gradlew :plugins:ai-services:shadowJar
          ./gradlew :plugins:google-services:shadowJar
          ./gradlew :plugins:bing-services:shadowJar

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create release directory
        run: |
          RELEASE_NAME="QTranslate-${{ steps.version.outputs.VERSION }}"
          mkdir -p "release/${RELEASE_NAME}/plugins"
          cp app/build/libs/QTranslate.jar "release/${RELEASE_NAME}/"
          cp plugins/ai-services/build/libs/ai-services-plugin.jar "release/${RELEASE_NAME}/plugins/ai-services.jar"
          cp plugins/google-services/build/libs/google-services-plugin.jar "release/${RELEASE_NAME}/plugins/google-services.jar"
          cp plugins/bing-services/build/libs/bing-services-plugin.jar "release/${RELEASE_NAME}/plugins/bing-services.jar"
          echo "RELEASE_NAME=${RELEASE_NAME}" >> $GITHUB_ENV

      - name: Create zip
        run: |
          cd release
          zip -r "${{ env.RELEASE_NAME }}.zip" "${{ env.RELEASE_NAME }}/"

      - name: Generate SHA256
        run: |
          cd release
          sha256sum "${{ env.RELEASE_NAME }}.zip" > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: QTranslate ${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          files: |
            release/${{ env.RELEASE_NAME }}.zip
            release/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
